<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px; height: 630px; overflow: hidden;
  background: #0d0d1a;
  font-family: 'Inter', system-ui, sans-serif;
  display: flex;
}
.left {
  flex: 1; padding: 60px;
  display: flex; flex-direction: column; justify-content: center;
}
.right {
  width: 380px; background: #141428;
  border-left: 1px solid #1e1e3a;
  display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px;
}
.badge {
  display: inline-block; background: #2563eb; color: #fff;
  font-size: 12px; font-weight: 700; padding: 4px 12px;
  border-radius: 4px; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 20px;
}
h1 { font-size: 52px; font-weight: 800; color: #e8e8f0; line-height: 1.1; margin-bottom: 20px; }
h1 span { color: #2563eb; }
p { font-size: 20px; color: #888899; line-height: 1.5; max-width: 460px; margin-bottom: 30px; }
.chip {
  display: inline-block; background: #1e1e3a; color: #e8e8f0;
  font-size: 13px; padding: 6px 14px; border-radius: 20px; margin: 4px;
  border: 1px solid #2a2a4a;
}
.car-icon { width: 120px; height: 120px; margin-bottom: 30px; }
.bottom-bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
  background: linear-gradient(90deg, #2563eb, #f59e0b);
}
.footer-credit { position: absolute; bottom: 20px; left: 60px; font-size: 13px; color: #555; }
</style>
</head>
<body>
<div class="left">
  <div class="badge">Rødovre, Denmark</div>
  <h1>Nick <span>Autoteknik</span></h1>
  <p>Professional auto repair shop website</p>
  <div>
    <span class="chip">Next.js</span>
    <span class="chip">TypeScript</span>
    <span class="chip">Tailwind CSS</span>
  </div>
</div>
<div class="right">
  <svg class="car-icon" viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="30" width="100" height="30" rx="5" fill="#2563eb"/>
    <rect x="25" y="15" width="70" height="20" rx="5" fill="#f59e0b"/>
    <circle cx="30" cy="62" r="10" fill="#1e1e3a" stroke="#2563eb" stroke-width="3"/>
    <circle cx="90" cy="62" r="10" fill="#1e1e3a" stroke="#2563eb" stroke-width="3"/>
    <circle cx="30" cy="62" r="4" fill="#2563eb"/>
    <circle cx="90" cy="62" r="4" fill="#2563eb"/>
  </svg>
  <div style="text-align:center">
    <div style="font-size:36px;font-weight:800;color:#f59e0b">Pro</div>
    <div style="font-size:13px;color:#888899;margin-bottom:15px">Service</div>
    <div style="font-size:36px;font-weight:800;color:#2563eb">All</div>
    <div style="font-size:13px;color:#888899">Car Makes</div>
  </div>
</div>
<div class="bottom-bar"></div>
<div class="footer-credit">Built by Babak Bandpey · cocode.dk · linkedin.com/in/babakbandpey</div>
</body>
</html>
